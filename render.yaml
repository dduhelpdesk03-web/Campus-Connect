# Render Blueprint for the complete CampusConnect app, including /admin.
# Keep this file beside package.json at the root of your GitHub repository.
# Uses one Free web service and an external Neon database; no Render database is created.
# Never put database credentials or your admin password in this file.
services:
  - type: web
    name: campus-connect
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && node scripts/migrate.mjs && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    # Check the app without repeatedly waking a sleeping free database.
    # For a database connectivity check, visit /api/health manually.
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
